name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build linux amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
            -ldflags="-s -w -X libshelf/internal/version.Commit=${GITHUB_SHA}" \
            -o libshelf-linux-amd64 ./cmd/libshelf
          ./libshelf-linux-amd64 version | grep -q "${GITHUB_SHA}"

      - name: Build windows amd64
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath \
            -ldflags="-s -w -X libshelf/internal/version.Commit=${GITHUB_SHA}" \
            -o libshelf-windows-amd64.exe ./cmd/libshelf

      - uses: actions/upload-artifact@v4
        with:
          name: libshelf-binaries
          path: |
            libshelf-linux-amd64
            libshelf-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish/update pre-release latest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="$(cat <<EOF
          commit ${GITHUB_SHA}

          ### Downloads
          - \`libshelf-linux-amd64\` — Linux server / VPS
          - \`libshelf-windows-amd64.exe\` — Windows: double-click to start, setup opens in the browser

          Windows: keep the console window open while using LibShelf.
          EOF
          )"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest \
              libshelf-linux-amd64 \
              libshelf-windows-amd64.exe \
              --clobber
            gh release edit latest --notes "$NOTES" --title "Latest (${GITHUB_SHA::7})"
          else
            gh release create latest \
              libshelf-linux-amd64 \
              libshelf-windows-amd64.exe \
              --title "Latest (${GITHUB_SHA::7})" \
              --notes "$NOTES" \
              --prerelease
          fi
