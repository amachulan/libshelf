<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моя полка</title>
  <script>
    (function () {
      var t = localStorage.getItem("libshelf_theme");
      if (t !== "light" && t !== "dark") {
        t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top" id="site-header">
    <div class="top-left">
      <a class="brand" href="/">Моя полка</a>
      <nav class="nav" aria-label="Основное">
        <a href="/" class="nav-link is-active" id="nav-home">Главная</a>
        <button type="button" class="nav-link" id="nav-catalog">Каталог</button>
        <button type="button" class="nav-link hidden" id="nav-lists">Списки</button>
        <button type="button" class="nav-link hidden" id="users-btn">Пользователи</button>
      </nav>
    </div>
    <form id="search-form" class="search" action="/" method="get">
      <input id="q" name="q" type="search" placeholder="Книга, автор или серия" autocomplete="off" autofocus>
      <button type="submit">Найти</button>
    </form>
    <div class="top-right">
      <button type="button" class="icon-btn" data-theme-toggle title="Тема" aria-label="Тема">☾</button>
      <div id="user-box" class="user-box hidden">
        <span id="user-label" class="user-label"></span>
        <button type="button" id="logout-btn" class="text-btn">Выйти</button>
      </div>
    </div>
  </header>

  <main id="site-main">
    <section id="home" class="panel">
      <p id="stats" class="stats"></p>
      <h1>Личная библиотека</h1>
      <p class="lead">Поиск сразу по автору, названию и серии. По умолчанию только книги на русском.</p>
      <div id="continue-block" class="continue-block hidden">
        <div class="section-head">
          <h2>Продолжить чтение</h2>
        </div>
        <div id="continue-grid" class="grid"></div>
      </div>
    </section>

    <section id="results" class="panel hidden">
      <button type="button" id="results-back" class="linkish hidden">← Назад</button>
      <h2 id="results-title">Результаты</h2>
      <p id="results-sub" class="results-sub hidden"></p>
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty hidden">Ничего не нашлось</p>
    </section>

    <section id="book" class="panel hidden">
      <button type="button" id="back" class="linkish">← К результатам</button>
      <div class="book-card">
        <div class="cover-wrap">
          <img id="book-cover" alt="" width="220" height="320">
        </div>
        <div class="book-meta">
          <h1 id="book-title"></h1>
          <p id="book-authors" class="authors"></p>
          <p id="book-series" class="series"></p>
          <p id="book-translators" class="translators hidden"></p>
          <p id="book-edition" class="edition hidden"></p>
          <p id="book-info" class="info"></p>
          <p id="book-genres" class="genres"></p>
          <div id="book-annotation" class="annotation hidden"></div>
          <div class="book-actions">
            <button type="button" id="book-read" class="btn">Читать</button>
            <a id="book-download" class="btn btn-secondary" href="#">Скачать FB2</a>
          </div>
          <div id="shelf-controls" class="shelf-controls hidden">
            <button type="button" class="shelf-pill" data-status="reading">Читаю</button>
            <button type="button" class="shelf-pill" data-status="read">Прочитано</button>
            <button type="button" class="shelf-pill" data-status="want">Хочу</button>
            <button type="button" class="shelf-pill shelf-clear" data-status="">Убрать</button>
          </div>
        </div>
      </div>
    </section>

    <section id="catalog" class="panel hidden">
      <h2>Каталог</h2>
      <div class="shelf-tabs" id="catalog-tabs">
        <button type="button" class="shelf-pill is-active" data-cat="authors">Авторы</button>
        <button type="button" class="shelf-pill" data-cat="genres">Жанры</button>
        <button type="button" class="shelf-pill" data-cat="series">Серии</button>
      </div>
      <div id="catalog-letters" class="letter-strip hidden"></div>
      <div id="catalog-loading" class="catalog-loading hidden" aria-live="polite" aria-busy="true">
        <span class="catalog-spinner" aria-hidden="true"></span>
        <span>Загрузка…</span>
      </div>
      <div id="catalog-list" class="catalog-list"></div>
      <p id="catalog-empty" class="empty hidden">Ничего нет</p>
    </section>

    <section id="lists" class="panel hidden">
      <h2>Списки</h2>
      <div class="shelf-tabs" id="shelf-tabs">
        <button type="button" class="shelf-pill is-active" data-status="reading">Читаю</button>
        <button type="button" class="shelf-pill" data-status="read">Прочитано</button>
        <button type="button" class="shelf-pill" data-status="want">Хочу</button>
      </div>
      <div id="lists-grid" class="grid"></div>
      <p id="lists-empty" class="empty hidden">Пока пусто</p>
    </section>

    <section id="users" class="panel hidden">
      <button type="button" id="users-back" class="linkish">← Назад</button>
      <h2>Пользователи</h2>
      <form id="user-form" class="user-form" autocomplete="off">
        <input id="new-username" class="field" name="libshelf_new_user" placeholder="Логин" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <input id="new-password" class="field" name="libshelf_new_pass" type="password" placeholder="Пароль" autocomplete="new-password" required>
        <select id="new-role" class="field" autocomplete="off">
          <option value="reader">Читатель</option>
          <option value="admin">Админ</option>
        </select>
        <button type="submit" class="btn" id="user-add-btn">Добавить</button>
      </form>
      <p id="users-error" class="error hidden"></p>
      <p id="users-ok" class="ok-msg hidden"></p>
      <table class="users-table">
        <thead>
          <tr><th>Логин</th><th>Роль</th><th></th></tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </section>
  </main>

  <div id="reader" class="reader hidden">
    <header class="reader-bar">
      <button type="button" id="reader-back" class="text-btn">← Назад</button>
      <div class="reader-title" id="reader-title"></div>
      <div class="reader-tools">
        <button type="button" id="reader-toc-btn" class="text-btn">Оглавление</button>
        <button type="button" id="reader-font-down" class="icon-btn" title="Мельче" aria-label="Мельче">A−</button>
        <button type="button" id="reader-font-up" class="icon-btn" title="Крупнее" aria-label="Крупнее">A+</button>
        <button type="button" class="icon-btn" data-theme-toggle title="Тема" aria-label="Тема">☾</button>
      </div>
    </header>
    <aside id="reader-toc" class="reader-toc hidden"></aside>
    <article id="reader-content" class="reader-content"></article>
  </div>

  <script src="/theme.js"></script>
  <script src="/app.js"></script>
</body>
</html>
