<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моя полка</title>
  <script>
    (function () {
      var t = localStorage.getItem("libshelf_theme");
      if (t !== "light" && t !== "dark") {
        t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="top-left">
      <a class="brand" href="/">Моя полка</a>
      <nav class="nav" aria-label="Основное">
        <a href="/" class="nav-link is-active" id="nav-home">Главная</a>
        <button type="button" class="nav-link hidden" id="users-btn">Пользователи</button>
      </nav>
    </div>
    <form id="search-form" class="search" action="/" method="get">
      <input id="q" name="q" type="search" placeholder="Книга, автор или серия" autocomplete="off" autofocus>
      <button type="submit">Найти</button>
    </form>
    <div class="top-right">
      <button type="button" class="icon-btn" data-theme-toggle title="Тема" aria-label="Тема">☾</button>
      <div id="user-box" class="user-box hidden">
        <span id="user-label" class="user-label"></span>
        <button type="button" id="logout-btn" class="text-btn">Выйти</button>
      </div>
    </div>
  </header>

  <main>
    <section id="home" class="panel">
      <p id="stats" class="stats"></p>
      <h1>Личная библиотека</h1>
      <p class="lead">Поиск сразу по автору, названию и серии. По умолчанию только книги на русском.</p>
    </section>

    <section id="results" class="panel hidden">
      <button type="button" id="results-back" class="linkish hidden">← Назад</button>
      <h2 id="results-title">Результаты</h2>
      <p id="results-sub" class="results-sub hidden"></p>
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty hidden">Ничего не нашлось</p>
    </section>

    <section id="book" class="panel hidden">
      <button type="button" id="back" class="linkish">← К результатам</button>
      <div class="book-card">
        <div class="cover-wrap">
          <img id="book-cover" alt="" width="220" height="320">
        </div>
        <div class="book-meta">
          <h1 id="book-title"></h1>
          <p id="book-authors" class="authors"></p>
          <p id="book-series" class="series"></p>
          <p id="book-translators" class="translators hidden"></p>
          <p id="book-edition" class="edition hidden"></p>
          <p id="book-info" class="info"></p>
          <p id="book-genres" class="genres"></p>
          <div id="book-annotation" class="annotation hidden"></div>
          <a id="book-download" class="btn" href="#">Скачать FB2</a>
        </div>
      </div>
    </section>

    <section id="users" class="panel hidden">
      <button type="button" id="users-back" class="linkish">← Назад</button>
      <h2>Пользователи</h2>
      <form id="user-form" class="user-form">
        <input id="new-username" class="field" placeholder="Логин" required>
        <input id="new-password" class="field" type="password" placeholder="Пароль" required>
        <select id="new-role" class="field">
          <option value="reader">Читатель</option>
          <option value="admin">Админ</option>
        </select>
        <button type="submit" class="btn">Добавить</button>
      </form>
      <p id="users-error" class="error hidden"></p>
      <table class="users-table">
        <thead>
          <tr><th>Логин</th><th>Роль</th><th></th></tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </section>
  </main>

  <script src="/theme.js"></script>
  <script src="/app.js"></script>
</body>
</html>
