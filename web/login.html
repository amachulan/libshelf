<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Вход — Моя полка</title>
  <script>
    (function () {
      var t = localStorage.getItem("libshelf_theme");
      if (t !== "light" && t !== "dark") {
        t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <main class="login-card">
    <button type="button" class="icon-btn" data-theme-toggle title="Тема" aria-label="Тема">☾</button>
    <h1>Моя полка</h1>
    <p class="lead">Войдите, чтобы открыть библиотеку</p>
    <form id="login-form" autocomplete="on">
      <label>
        Логин
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
      <label>
        Пароль
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="error" class="error hidden"></p>
      <button type="submit">Войти</button>
    </form>
  </main>
  <script src="/theme.js"></script>
  <script src="/login.js"></script>
</body>
</html>
